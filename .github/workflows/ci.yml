name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Org workflow templates present
        run: |
          set -euo pipefail
          test -d .github/workflows
          ls .github/workflows
          # reusable org workflows are templates/support, not product runtime
          echo "EpiowAI/.github structure gate ok"
